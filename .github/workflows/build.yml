name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git libxml2 libtinfo5
      - name: Get Theos
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git theos
          git clone --depth=1 https://github.com/theos/sdks.git sdks
          cp -r sdks/iPhoneOS9.3.sdk sdks/iPhoneOS10.3.sdk theos/sdks/
      - name: Get toolchain
        run: |
          mkdir -p theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C theos/toolchain/
      - name: Check launch stubs
        run: |
          for v in 9.3 10.3; do echo "== SDK $v"; ls theos/sdks/iPhoneOS$v.sdk/usr/lib/system | grep -i launch || echo "no launch files"; done
      - name: Build
        run: |
          make package || make clean package TARGET=iphone:clang:10.3:7.0
      - name: Inspect result
        if: always()
        run: |
          ls -R packages 2>/dev/null || true
          find .theos -type f -name hello4 -exec file {} \; || true
      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello4-deb
          path: packages/*.deb
          if-no-files-found: warn
